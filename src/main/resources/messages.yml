skills_gui:
  title: "<black>Skills Menu"
  already_have: "<red>You already have this skill!"
  no_res: "<red>Not enough currency!"
  purchased: "<green>Skill purchased!"
  price: "<yellow>Price: <price>"
  tick: "<green>Purchased✓"
  skills:
    thief:
      money: "<dark_green>Money Thirst"
      money_desc: "10% chance to steal when hitting a Player"
      money_desc1: "Steals 5% of their currency"
      money_desc2: "and transfers it to the skill owner."

      speed: "<dark_green>Thief's Speed"
      speed_desc: "<dark_purple>Grants permanent <white>Speed I"

      haste: "<dark_green>Quick Hands"
      haste_desc: "<dark_purple>Grants permanent <white>Haste I"

      stole_exp: "<dark_green>Experience Thief"
      stole_exp_desc: "15% chance to steal when hitting a Player"
      stole_exp_desc1: "steals 5-10 experience points from them"
      stole_exp_desc2: "and transfers it to the skill owner."

      caution: "<dark_green>Thief's Caution"
      caution_desc: "When taking damage, 8% chance for the owner"
      caution_desc1: "to receive <white>Resistance I<dark_purple> for 8 seconds."

      specialization: "<dark_green>Thief's Specialization"
      specialization_desc: "If the skill owner doesn't have a shield in their offhand."
      specialization_desc1: "Applies effects: <white>Speed II<dark_purple> and <white>Haste II"

    killer:
      money: "<red>Money Thirst"
      money_desc: "If the owner kills a player."
      money_desc1: "Takes 30% of the victim's coins."
      money_desc2: "Cooldown: 3 minutes."
      money_desc3: "Killing mobs has 40% chance"
      money_desc4: "to give 1-15 coins."

      speed: "<red>Assassin's Speed"
      speed_desc: "Grants permanent <white>Speed I"

      murder: "<red>Bloodlust"
      murder_desc: "If the skill owner hits a player"
      murder_desc1: "50% chance to receive <white>Strength I<dark_purple> for 15 seconds."

      haste: "<red>Assassin's Haste"
      haste_desc: "If the skill owner hits a player"
      haste_desc1: "15% chance to receive <white>Haste I<dark_purple> for 10 seconds."

      vampirism: "<dark_red>Vampirism"
      vampirism_desc: "15% chance when owner attacks another player."
      vampirism_desc1: "Owner deals 1 heart of pure damage"
      vampirism_desc2: "and heals half a heart."

      recovery: "<red>Lethal Recovery"
      recovery_desc: "If the owner kills a player."
      recovery_desc1: "Owner receives: <white>Speed III<dark_purple> for 6 seconds,"
      recovery_desc2: "<white>Resistance II<dark_purple> for 5 seconds, <white>Regeneration I<dark_purple> for 30 seconds."

    merchant:
      money: "<yellow>Money Thirst"
      money_desc: "When owner trades with a villager."
      money_desc1: "25% chance to receive 1-15 currency."

      luck: "<yellow>Trader's Luck"
      luck_desc: "When owner mines ore."
      luck_desc1: "35% chance to add 2-4 ore to the mined ore"

      exp: "<yellow>Experienced Trader"
      exp_desc: "When owner trades with a villager."
      exp_desc1: "45% chance to receive 5-25 experience points."

      run: "<yellow>Trader's Escape"
      run_desc: "When owner is hit by other players."
      run_desc1: "For 1 hit: <white>Speed I<dark_purple> for 10 seconds,"
      run_desc2: "For 4 hits: <white>Speed II<dark_purple> for 10 seconds,"
      run_desc3: "For 8 hits: <white>Speed III<dark_purple> and <white>Resistance<dark_purple> for 15 seconds."
      run_desc4: "Hit counter resets if owner"
      run_desc5: "wasn't attacked for 5 seconds."

      hero: "<yellow>Trader's Discounts"
      hero_desc: "Owner permanently receives: <white>Hero of the Village II"

      blessing: "<yellow>Mercury's Blessing"
      blessing_desc: "If owner holds a totem of undying in offhand."
      blessing_desc1: "Owner gains +6 hearts."
      blessing_desc2: "When taking damage, 15% chance to heal 4 hearts."

    tank:
      money: "<gray>Money Thirst"
      money_desc: "When taking damage from a player."
      money_desc2: "20% chance for owner to receive"
      money_desc3: "3 + number of allies (max 12) coins"
      money_desc4: "Allies must be within 10 blocks"

      block: "<gray>Block Master"
      block_desc: "When taking damage."
      block_desc2: "9% chance to block"
      block_desc3: "incoming damage."

      parry: "<gray>Parry"
      parry_desc: "When taking damage."
      parry_desc2: "35% chance to reflect 50% damage back to attacker"

      balance: "<gray>Balance"
      balance_desc: "Incoming damage reduced by 30%"
      balance_desc2: "Damage dealt to players reduced by 25%"
      balance_desc3: "Damage dealt to mobs reduced by 12.5%"

      block_aura: "<gray>Block Aura"
      block_aura_desc: "All allies within 12 blocks"
      block_aura_desc2: "have 15% chance when taking damage"
      block_aura_desc3: "to block the damage"

      redirect_aura: "<gray>Redirect Aura"
      redirect_aura_desc: "All allies within 6 blocks"
      redirect_aura_desc2: "have 30% chance when taking damage"
      redirect_aura_desc3: "to redirect damage to the skill owner."

